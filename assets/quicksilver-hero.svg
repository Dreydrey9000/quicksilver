<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Public Sans, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#101830"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="220" fill="#6ea8fe" opacity="0.06"/>
  <circle cx="1030" cy="90" r="120" fill="#34d399" opacity="0.05"/>

  <!-- title -->
  <text x="80" y="150" fill="#34d399" font-size="22" font-weight="700" letter-spacing="8">OPEN SOURCE · MIT</text>
  <text x="80" y="230" fill="#f5f1e8" font-size="86" font-weight="800" letter-spacing="-2">QuickSilver</text>
  <text x="80" y="292" fill="#c7d0e0" font-size="28">Find what&#8217;s slowing down your app. Build the fix. Prove it.</text>

  <!-- loop -->
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="80"  y="360" width="230" height="86" rx="12" fill="#111827" stroke="#1e2740"/>
    <text x="195" y="398" fill="#6ea8fe">01 MEASURE</text>
    <text x="195" y="426" fill="#66748f" font-size="15" font-weight="400">before numbers on record</text>

    <rect x="340" y="360" width="230" height="86" rx="12" fill="#111827" stroke="#1e2740"/>
    <text x="455" y="398" fill="#6ea8fe">02 DIAGNOSE</text>
    <text x="455" y="426" fill="#66748f" font-size="15" font-weight="400">one bottleneck, with evidence</text>

    <rect x="600" y="360" width="230" height="86" rx="12" fill="#111827" stroke="#1e2740"/>
    <text x="715" y="398" fill="#6ea8fe">03 FIX</text>
    <text x="715" y="426" fill="#66748f" font-size="15" font-weight="400">smallest safe change</text>

    <rect x="860" y="360" width="230" height="86" rx="12" fill="#111827" stroke="#34d399"/>
    <text x="975" y="398" fill="#34d399" filter="url(#glow)">04 PROVE</text>
    <text x="975" y="426" fill="#66748f" font-size="15" font-weight="400">before / after table</text>
  </g>
  <g stroke="#2a3a5c" stroke-width="2">
    <line x1="310" y1="403" x2="340" y2="403"/><line x1="570" y1="403" x2="600" y2="403"/><line x1="830" y1="403" x2="860" y2="403"/>
  </g>

  <!-- speed strip -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="22">
    <text x="80" y="530" fill="#66748f">/api/members  840ms &#8594; 120ms</text>
    <text x="560" y="530" fill="#34d399" font-weight="700">-86%</text>
    <text x="80" y="568" fill="#66748f">GET /  LCP    3.1s  &#8594; 1.2s</text>
    <text x="560" y="568" fill="#34d399" font-weight="700">-61%</text>
  </g>
  <text x="1120" y="600" fill="#3a4a6a" font-size="18" text-anchor="end" font-family="ui-monospace, monospace">github.com/Dreydrey9000/quicksilver</text>
</svg>
