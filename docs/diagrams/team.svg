<svg xmlns="http://www.w3.org/2000/svg" width="960" height="810" viewBox="0 0 960 810" role="img" aria-labelledby="t d"><title id="t">RAMsey and QuickSilver workflow</title><desc id="d">A human requests diagnostics or enables five-minute login pressure checks. Native evidence stays private. An assistant hands a slow operation to QuickSilver, which proposes one fix and remeasures. Production changes require approval.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C6532C"/></marker></defs><rect width="960" height="810" fill="#EEE9DF"/><g font-family="sans-serif" fill="#171917"><text x="60" y="45" font-size="25" font-weight="bold">Agent RAMsey / QuickSilver workflow</text><rect x="60" y="90" width="360" height="95" fill="#F6F2E9" stroke="#171917" stroke-width="2"/><text x="78" y="125" font-size="19" font-weight="bold">Human or coding assistant</text><text x="78" y="157" font-size="15">Commands / explicit onboarding</text><rect x="540" y="90" width="360" height="95" fill="#F6F2E9" stroke="#171917" stroke-width="2"/><text x="558" y="125" font-size="19" font-weight="bold">RAMsey native Mac reads</text><text x="558" y="157" font-size="15">Bounded diagnostics, no model</text><rect x="60" y="250" width="360" height="110" fill="#F6F2E9" stroke="#171917" stroke-width="2"/><text x="78" y="285" font-size="19" font-weight="bold">Owned login LaunchAgent</text><text x="78" y="317" font-size="15">Five-minute pressure checks / awake</text><rect x="540" y="250" width="360" height="110" fill="#F6F2E9" stroke="#171917" stroke-width="2"/><text x="558" y="285" font-size="19" font-weight="bold">Evidence and private state</text><text x="558" y="317" font-size="15">CPU, RSS, history, work, capacity, energy</text><rect x="60" y="430" width="360" height="110" fill="#F6F2E9" stroke="#171917" stroke-width="2"/><text x="78" y="465" font-size="19" font-weight="bold">Status and local notices</text><text x="78" y="497" font-size="15">Quiet when healthy / permission dependent</text><rect x="540" y="430" width="360" height="110" fill="#F6F2E9" stroke="#171917" stroke-width="2"/><text x="558" y="465" font-size="19" font-weight="bold">Assistant-coordinated handoff</text><text x="558" y="497" font-size="15">QuickSilver: measure one app bottleneck</text><rect x="540" y="610" width="360" height="110" fill="#F6F2E9" stroke="#171917" stroke-width="2"/><text x="558" y="645" font-size="19" font-weight="bold">One proposed fix, then remeasure</text><text x="558" y="677" font-size="15">Separate latency and resource evidence</text></g><g fill="none" stroke="#C6532C" stroke-width="3" marker-end="url(#a)"><path d="M420 137H533"/><path d="M240 185V242"/><path d="M720 185V242"/><path d="M240 360V422"/><path d="M420 305H533"/><path d="M720 360V422"/><path d="M720 540V602"/></g><text x="60" y="770" font-family="sans-serif" font-size="18" fill="#171917">No app control. No agent polling loop. Production deployment requires explicit approval.</text></svg>